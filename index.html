<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snowball Learning: Derzkiy Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #b3e5fc; font-family: 'Arial', sans-serif; }
        #game-ui {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; display: flex; flex-direction: column; align-items: center;
        }
        .question-area {
            margin-top: 30px; background: rgba(255,255,255,0.85);
            padding: 20px; border-radius: 30px; border: 4px solid #0288d1;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1); width: 80%; text-align: center;
        }
        h2 { color: #01579b; margin: 0; font-size: 22px; }
        #score { position: absolute; bottom: 20px; right: 20px; font-weight: bold; color: white; text-shadow: 1px 1px 4px rgba(0,0,0,0.5); }
    </style>
</head>
<body>
    <div id="game-ui">
        <div class="question-area">
            <h2 id="qText">Yükleniyor...</h2>
        </div>
        <div id="score">Puan: 0</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    
    <script src="questions.js"></script>
    <script src="game.js"></script>
</body>
</html>
