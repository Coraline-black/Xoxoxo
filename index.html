<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Snow Grammar Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #cfe9ff;
      font-family: Arial, sans-serif;
    }

    #ui {
      position: absolute;
      top: 20px;
      width: 100%;
      text-align: center;
      z-index: 10;
    }

    #question {
      display: inline-block;
      background: rgba(255,255,255,0.9);
      padding: 15px 25px;
      border-radius: 20px;
      font-size: 20px;
    }

    #start {
      position: absolute;
      inset: 0;
      background: #cfe9ff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }

    button {
      font-size: 24px;
      padding: 20px 40px;
      border-radius: 30px;
      border: none;
      cursor: pointer;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.152.2/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

<div id="ui">
  <div id="question">Загрузка...</div>
</div>

<div id="start">
  <button id="startBtn">НАЧАТЬ</button>
</div>

<script src="main.js"></script>
</body>
</html>
