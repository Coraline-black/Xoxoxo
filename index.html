<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Running Snowman: Nightly Journey</title>
    <style>
        /* Стиль в духе твоего скриншота */
        body { 
            margin: 0; overflow: hidden; 
            background: radial-gradient(circle at center, #1a2f2c 0%, #0d1a19 100%); 
            font-family: 'Segoe UI', sans-serif; 
        }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        .q-card { 
            margin: 30px auto; width: 80%; 
            background: rgba(25, 45, 42, 0.9);
            padding: 25px; border-radius: 40px; 
            border: 3px solid #4ade80; /* Зеленая обводка как на скрине */
            text-align: center; 
            box-shadow: 0 0 30px rgba(74, 222, 128, 0.2);
        }
        
        h2 { color: #ffffff; font-size: 24px; margin: 0; letter-spacing: 1px; text-transform: uppercase; }
        #score-board { 
            position: absolute; bottom: 30px; left: 30px; 
            color: #4ade80; font-size: 20px; font-weight: bold;
            text-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
        }
    </style>
</head>
<body>
    <div id="ui">
        <div class="q-card"><h2 id="qText">Yükleniyor...</h2></div>
        <div id="score-board">PUAN: 0</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    
    <script src="questions.js"></script>
    <script src="ai_logic.js"></script>
    <script src="game.js"></script>
</body>
</html>
